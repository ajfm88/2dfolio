<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <title>🥚 Tetris Attack 🧩</title>
    <meta
      name="description"
      content="A browser re-implementation of the SNES puzzle game Tetris Attack (Panel de Pon), created using HTML5, CSS3 & JavaScript ES6 and deployed by ajfm88."
    />
    <!-- The overlays draw their own art, so there is nothing in-page to preview --
         the logo stands in for it on link previews and search results instead. -->
    <link rel="canonical" href="https://tetris-attack-ajfm88.netlify.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Tetris Attack" />
    <meta
      property="og:description"
      content="A browser re-implementation of the SNES puzzle game Tetris Attack (Panel de Pon), created using HTML5, CSS3 & JavaScript ES6 and deployed by ajfm88."
    />
    <meta property="og:url" content="https://tetris-attack-ajfm88.netlify.app/" />
    <meta property="og:image" content="https://tetris-attack-ajfm88.netlify.app/assets/logo.png" />
    <meta property="og:image:width" content="163" />
    <meta property="og:image:height" content="107" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tetris Attack" />
    <meta
      name="twitter:description"
      content="A browser re-implementation of the SNES puzzle game Tetris Attack (Panel de Pon), created using HTML5, CSS3 & JavaScript ES6 and deployed by ajfm88."
    />
    <meta name="twitter:image" content="https://tetris-attack-ajfm88.netlify.app/assets/logo.png" />
    <style>
      /* The page is only ever a backdrop for the canvases and the DOM overlays.
         Without this the deployed site is a white surround around a dark game. */
      html,
      body {
        margin: 0;
        min-height: 100%;
        min-height: 100dvh;
        background: #07050f;
        color: #f4f4ff;
        font-family: "Press Start 2P", "Courier New", monospace;
        /* Avoid iOS rubber-band revealing white behind the game. */
        overscroll-behavior: none;
      }
      /* Boards are JS-sized from the viewport ladder (scale + chrome).
         flex-direction is set inline by App for side-by-side vs stacked. */
      #ta-stage {
        display: flex;
        flex-wrap: nowrap;
        align-items: center;
        justify-content: center;
        gap: 20px;
        min-height: 100vh;
        min-height: 100dvh;
        /* 8px matches viewport.STAGE_PAD so scale 1/2 fits a 390px phone. */
        padding: max(8px, env(safe-area-inset-top))
                 max(8px, env(safe-area-inset-right))
                 max(8px, env(safe-area-inset-bottom))
                 max(8px, env(safe-area-inset-left));
        box-sizing: border-box;
        user-select: none;
        -webkit-user-select: none;
      }
      #ta-vs-shell {
        flex-shrink: 0;
      }
    </style>
    <script src="/js/ta.js"></script>
  </head>
  <body>
    <div id="ta-stage">
      <div class="game" id="game-container-left"></div>
      <div class="game" id="game-container-right"></div>
      <div id="ta-vs-shell" hidden></div>
    </div>

    <script>
      TA.InitiateGame();
    </script>
  </body>
</html>
